name: Node CI Workflow

on:
  push:
  pull_request:
    branches:
      - V3

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ '20', '22' ]
    name: Node ${{ matrix.node }} test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run tests
        run: |
          npm install
          npm test
          npm run test:tsd
